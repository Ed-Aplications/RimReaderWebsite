<svg viewBox="0 0 540 430" role="img" aria-labelledby="dg-steer"><title id="dg-steer">Steer-ahead. Both front wheels point a little to one side of the thrust line while the steering wheel is straight, so driving straight needs the steering wheel turned.</title>
<rect class="d-fill" x="135.0" y="70" width="150" height="300" rx="34"/>
<rect class="d-bg" x="153.0" y="140" width="114" height="70" rx="12"/>
<rect class="d-bg" x="153.0" y="270" width="114" height="50" rx="12"/>
<g transform="rotate(-8 131.0 132)"><rect class="d-accfill" x="120.0" y="102" width="22" height="60" rx="6"/></g>
<g transform="rotate(-8 289.0 132)"><rect class="d-accfill" x="278.0" y="102" width="22" height="60" rx="6"/></g>
<g transform="rotate(0 131.0 308)"><rect class="d-accfill" x="120.0" y="278" width="22" height="60" rx="6"/></g>
<g transform="rotate(0 289.0 308)"><rect class="d-accfill" x="278.0" y="278" width="22" height="60" rx="6"/></g>
<line class="d-dash" x1="210" y1="30" x2="210" y2="400"/>
<line class="d-acc" x1="210" y1="172" x2="189.1" y2="23.5"/>
<text class="d-small" x="222" y="28">dashed: the thrust line</text>
<text class="d-acctext" x="318" y="162">front wheels&#8217; average</text>
<text class="d-small" x="318" y="180">direction, off the thrust line</text>
<g transform="translate(400 300) rotate(14)"><circle class="d-line" cx="0" cy="0" r="40"/><circle class="d-line" cx="0" cy="0" r="9"/><line class="d-line" x1="-40" y1="0" x2="-9" y2="0"/><line class="d-line" x1="9" y1="0" x2="40" y2="0"/><line class="d-line" x1="0" y1="9" x2="0" y2="40"/></g>
<text class="d-small" x="400" y="364" text-anchor="middle">steering wheel sits</text>
<text class="d-small" x="400" y="381" text-anchor="middle">turned when driving straight</text>
<text class="d-small" x="260" y="420" text-anchor="middle">Seen from above. Angles exaggerated, not to scale.</text>
</svg>