<svg viewBox="0 0 540 430" role="img" aria-labelledby="dg-thrust"><title id="dg-thrust">Thrust angle. The rear wheels point the car slightly off its centreline. The thrust line, square to the rear axle, is at an angle to the body's centreline: that angle is the thrust angle.</title>
<text class="d-text" x="210" y="40" text-anchor="middle">FRONT</text>
<path class="d-thin" d="M200 52 L210 44 L220 52"/>
<rect class="d-fill" x="135.0" y="70" width="150" height="300" rx="34"/>
<rect class="d-bg" x="153.0" y="140" width="114" height="70" rx="12"/>
<rect class="d-bg" x="153.0" y="270" width="114" height="50" rx="12"/>
<g transform="rotate(0 131.0 132)"><rect class="d-accfill" x="120.0" y="102" width="22" height="60" rx="6"/></g>
<g transform="rotate(0 289.0 132)"><rect class="d-accfill" x="278.0" y="102" width="22" height="60" rx="6"/></g>
<g transform="rotate(7 131.0 308)"><rect class="d-accfill" x="120.0" y="278" width="22" height="60" rx="6"/></g>
<g transform="rotate(7 289.0 308)"><rect class="d-accfill" x="278.0" y="278" width="22" height="60" rx="6"/></g>
<line class="d-dash" x1="210" y1="56" x2="210" y2="400"/>
<line class="d-acc" x1="210" y1="308" x2="238.0" y2="79.7"/>
<path class="d-accfill" transform="rotate(7 238.0 79.7)" d="M230.0 93.7 L238.0 77.7 L246.0 93.7 Z"/>
<path class="d-acc" d="M210 188 A120 120 0 0 1 224.6 188.9" style="stroke-width:2"/>
<line class="d-thin" x1="131.0" y1="308" x2="289.0" y2="308"/>
<text class="d-acctext" x="318" y="158">thrust line</text>
<text class="d-small" x="318" y="176">where the rear axle points the car</text>
<text class="d-text" x="318" y="212">thrust angle</text>
<text class="d-small" x="318" y="230">between the two lines</text>
<text class="d-small" x="318" y="110">dashed: the body&#8217;s centreline,</text>
<text class="d-small" x="318" y="128">read at the front door glass</text>
<text class="d-small" x="260" y="420" text-anchor="middle">Seen from above. Angles exaggerated, not to scale.</text>
